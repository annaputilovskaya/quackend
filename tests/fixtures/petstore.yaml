openapi: 3.0.3
info:
  title: Petstore-ish
  version: 1.0.0
paths:
  /users:
    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { "$ref": "#/components/schemas/User" }
    post:
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/User" }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/User" }
    put:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/User" }
    delete:
      responses:
        '200':
          description: deleted
components:
  schemas:
    User:
      type: object
      properties:
        name: { type: string, example: Alice }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        active: { type: boolean }